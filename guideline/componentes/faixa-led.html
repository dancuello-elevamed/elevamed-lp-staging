<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>Faixa LED (pacote completo) · Componente Elevamed</title>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Lexend:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens/tokens.css">
<style>
body{margin:0;background:var(--ev-off);color:var(--ev-escuro);font:300 16px/1.6 var(--ev-fonte-texto);padding:40px 16px}
.demo{max-width:var(--ev-container);margin:0 auto}
/* ---- componente ---- */
.led{display:flex;background:var(--ev-ambar);color:var(--ev-escuro);text-decoration:none;overflow:hidden;border-top:2px solid var(--ev-escuro);border-bottom:2px solid var(--ev-escuro)}
.led-tag{flex:none;display:flex;align-items:center;background:var(--ev-escuro);color:var(--ev-ambar);font:400 11px/1 var(--ev-fonte-rotulo);letter-spacing:.18em;padding:0 18px}
.led-trilho{flex:1;overflow:hidden;display:flex}
.led-faixa{display:flex;align-items:center;gap:22px;padding:16px 0 16px 22px;white-space:nowrap;animation:led 32s linear infinite}
.led:hover .led-faixa{animation-play-state:paused}
.led-i,.led-d{font:500 15px/1 var(--ev-fonte-texto);text-transform:uppercase}
.led-d{background:var(--ev-escuro);color:var(--ev-ambar);border-radius:999px;padding:6px 12px}
.led-s{width:12px;height:12px;fill:var(--ev-escuro);flex:none}
@keyframes led{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (max-width:600px){.led-tag{display:none}.led-faixa{animation-duration:26s}}
@media (prefers-reduced-motion:reduce){.led-faixa{animation:none;flex-wrap:wrap;white-space:normal}}
</style></head><body>
<!-- Faixa LED (pacote completo): Única peça em âmbar. Duplique o grupo de itens para o loop ficar contínuo. -->
<div class="demo">
<a class="led" href="#planos" aria-label="Pacote completo"><span class="led-tag" aria-hidden="true">PACOTE COMPLETO</span><span class="led-trilho" aria-hidden="true"><span class="led-faixa"><span class="led-i">Frete grátis</span><svg class="led-s" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0l1.4 4.6L12 6l-4.6 1.4L6 12 4.6 7.4 0 6l4.6-1.4z"/></svg><span class="led-i">Avaliação médica inclusa</span><svg class="led-s" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0l1.4 4.6L12 6l-4.6 1.4L6 12 4.6 7.4 0 6l4.6-1.4z"/></svg><span class="led-i">30% OFF na 1ª parcela</span><svg class="led-s" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0l1.4 4.6L12 6l-4.6 1.4L6 12 4.6 7.4 0 6l4.6-1.4z"/></svg><span class="led-d">3 + 1: o 4º mês é por nossa conta</span><svg class="led-s" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0l1.4 4.6L12 6l-4.6 1.4L6 12 4.6 7.4 0 6l4.6-1.4z"/></svg><span class="led-i">Você só paga se o médico aprovar</span><svg class="led-s" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0l1.4 4.6L12 6l-4.6 1.4L6 12 4.6 7.4 0 6l4.6-1.4z"/></svg><span class="led-i">Frete grátis</span><svg class="led-s" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0l1.4 4.6L12 6l-4.6 1.4L6 12 4.6 7.4 0 6l4.6-1.4z"/></svg><span class="led-i">Avaliação médica inclusa</span><svg class="led-s" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0l1.4 4.6L12 6l-4.6 1.4L6 12 4.6 7.4 0 6l4.6-1.4z"/></svg><span class="led-i">30% OFF na 1ª parcela</span><svg class="led-s" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0l1.4 4.6L12 6l-4.6 1.4L6 12 4.6 7.4 0 6l4.6-1.4z"/></svg><span class="led-d">3 + 1: o 4º mês é por nossa conta</span><svg class="led-s" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0l1.4 4.6L12 6l-4.6 1.4L6 12 4.6 7.4 0 6l4.6-1.4z"/></svg><span class="led-i">Você só paga se o médico aprovar</span><svg class="led-s" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0l1.4 4.6L12 6l-4.6 1.4L6 12 4.6 7.4 0 6l4.6-1.4z"/></svg></span></span></ </div>
</body></html>
