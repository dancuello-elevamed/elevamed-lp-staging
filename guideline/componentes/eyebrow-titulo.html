<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>Eyebrow + título · Componente Elevamed</title>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Lexend:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens/tokens.css">
<style>
body{margin:0;background:var(--ev-off);color:var(--ev-escuro);font:300 16px/1.6 var(--ev-fonte-texto);padding:40px 16px}
.demo{max-width:var(--ev-container);margin:0 auto}
/* ---- componente ---- */
.eyebrow{font:400 var(--ev-rotulo)/1 var(--ev-fonte-rotulo);letter-spacing:var(--ev-rotulo-tracking);color:var(--ev-cinza);text-transform:uppercase}
.h2{margin:10px 0 0;font:500 var(--ev-h2)/1.2 var(--ev-fonte-texto);letter-spacing:-.02em;text-wrap:balance}
.eyebrow-pilula{display:inline-flex;align-items:center;gap:10px;border:1.5px solid var(--ev-escuro);border-radius:999px;padding:5px 6px 5px 14px;color:var(--ev-escuro)}
.eyebrow-pilula i{width:20px;height:20px;border-radius:50%;background:var(--ev-escuro)}
@media (max-width:600px){.h2{font-size:var(--ev-h2-mob)}}
</style></head><body>
<!-- Eyebrow + título: Todo H2 tem um eyebrow em Michroma acima. -->
<div class="demo">
<span class="eyebrow">COMO FUNCIONA</span>
<h2 class="h2">Simples, discreto e online</h2>
<br><span class="eyebrow eyebrow-pilula">O CUSTO DE ESPERAR <i></i></span>
</div>
</body></html>
